<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
<div class="container mt-4">
    <h1>Crear Nuevo Animal</h1>

    <form action="#" th:action="@{/animales/crear}" th:object="${animal}" method="post">

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="vida" class="form-label">Vida Media (años):</label>
            <input type="number" id="vida" th:field="*{vidaMedia}" class="form-control" required />
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" id="extinto" th:field="*{extinto}" class="form-check-input" />
            <label for="extinto" class="form-check-label">¿Está extinto?</label>
        </div>

        <div>
            <button type="submit" class="btn btn-dark">Crear</button>
        </div>
    </form>

    <br>
    <a class="btn btn-dark btn-sm" th:href="@{/animales}">Volver al listado</a>
</div>
</body>
</html>
