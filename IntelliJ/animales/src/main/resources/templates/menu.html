
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menú Principal - Animales</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h1>Gestión de Animales</h1>
    <p>Bienvenido al sistema de gestión de animales.</p>

    <hr>

    <h3>Menú Principal</h3>
    <p>Selecciona una opción:</p>

    <div class="card mt-4">
        <div class="card-body">
            <h5 class="card-title">Gestionar Animales</h5>

            <p class="card-text">
                Consulta, crea, edita y elimina animales
                de la base de datos.
            </p>

            <a th:href="@{/animales}" class="btn btn-dark">
                Ver Animales
            </a>

            <a th:href="@{/animales/crear}" class="btn btn-dark">
                Crear Animal
            </a>
        </div>
    </div>

    <div class="card mt-3">
        <div class="card-body">
            <h5 class="card-title">Gestionar Clases</h5>

            <p class="card-text">
                Administración de clases de animales.
            </p>

            <a th:href="@{/clases}" class="btn btn-dark">
                Ver Clases
            </a>
        </div>
    </div>

</div>

</body>
</html>
