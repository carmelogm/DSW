<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles del animal</title>
</head>
<body>
    <h1>Detalles del animal</h1>
    <div th:if="${animal != null}">
        <p> Nombre: <span th:text="${animal.nombre}"></span></p>
        <p> Vida Media: <span th:text="${animal.vidaMedia}"></span></p>
        <p> Extinto: <span th:text="${animal.extinto ? 'Sí' : 'No'}"></span></p>
    </div>
</body>
</html>
